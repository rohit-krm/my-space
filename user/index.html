<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Creator Portal — ToolsHub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-config.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], mono: ['"JetBrains Mono"', 'monospace'] } }
      }
    }
  </script>

  <style>
    body { background: #f8fafc; color: #0f172a; }
    .tab-active { background-color: #eff6ff !important; border-color: #3b82f6 !important; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.12); }
    .highlight-pulse { animation: pulseGlow 2.5s ease-out; }
    @keyframes pulseGlow { 0% { background-color: #fef08a; border-color: #eab308; } 100% { background-color: white; } }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-blue-600 selection:text-white">

  <!-- ================= AUTH VIEW ================= -->
  <div id="loggedInView" style="display:none;" class="flex-1 flex flex-col">
    
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-6">
          <a href="/" class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-xs">
              <i data-lucide="blocks" class="w-4 h-4"></i>
            </div>
            <span class="font-extrabold text-base tracking-tight text-slate-900">ToolsHub</span>
          </a>

          <nav class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold">
            <button id="viewBtnDashboard" onclick="switchMainView('dashboard')" class="px-3 py-1.5 rounded-lg bg-white shadow-xs text-blue-600">⚡ Dashboard</button>
            <button id="viewBtnManage" onclick="switchMainView('manage')" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900">📁 My Tools</button>
          </nav>
        </div>

        <div class="flex items-center gap-3">
          <!-- Dedicated New Page Link -->
          <a href="/user/new" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm transition-all">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>Add Tool</span>
          </a>

          <!-- Avatar & Menu -->
          <div class="relative">
            <button onclick="toggleDropdown()" id="avatarBtn" class="w-8 h-8 rounded-full border border-slate-300 overflow-hidden flex items-center justify-center bg-blue-50 text-blue-600 font-bold text-xs">
              <span id="avatarInitials">U</span>
              <img id="avatarImg" class="w-full h-full object-cover hidden" alt="Avatar">
            </button>

            <div id="profileDropdown" class="absolute right-0 top-full mt-2 w-56 bg-white border border-slate-200 rounded-xl shadow-lg p-2 hidden flex-col z-50 text-xs">
              <div class="px-2.5 py-2 border-b border-slate-100 mb-1">
                <div id="dropdownUserName" class="font-bold text-slate-900 truncate">User</div>
                <div id="dropdownUserEmail" class="text-[11px] text-slate-500 truncate">user@gmail.com</div>
              </div>
              <a href="/" class="px-2.5 py-1.5 rounded-lg hover:bg-slate-50 text-slate-700 flex items-center gap-2">
                <i data-lucide="home" class="w-3.5 h-3.5"></i> Home
              </a>
              <button onclick="logout()" class="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-red-50 text-red-600 flex items-center gap-2">
                <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Sign out
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 flex-1">
      
      <!-- ================= DASHBOARD VIEW ================= -->
      <section id="dashboardView">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
          <div>
            <h1 class="text-lg font-bold text-slate-900">Quick App Workspace</h1>
            <p class="text-xs text-slate-500">Aapke top 10 most-used aur pinned tools ka live interactive dock</p>
          </div>

          <!-- Sorting Filters -->
          <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-2 py-1 text-xs">
            <span class="text-slate-400 font-medium">Sort by:</span>
            <select id="sortFilter" onchange="applySort(this.value)" class="bg-transparent font-semibold text-slate-700 outline-none">
              <option value="recent">Recently Used</option>
              <option value="views">Most Used (Views)</option>
              <option value="alpha">Name (A-Z)</option>
            </select>
          </div>
        </div>

        <div class="rounded-2xl border border-slate-200 bg-white shadow-sm p-4 sm:p-5">
          <!-- Dock Tabs -->
          <div id="dashTabsContainer" class="grid grid-cols-2 sm:grid-cols-5 gap-2 pb-4 border-b border-slate-100">
            <div class="col-span-full py-6 text-center text-xs text-slate-400 font-mono">Loading tools...</div>
          </div>

          <!-- Active Runner -->
          <div class="mt-4">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="dashActiveTitle" class="text-xs font-bold text-slate-800">Runner</span>
              </div>
              <div class="flex items-center gap-2">
                <button id="dashEditCodeBtn" onclick="openCurrentToolEditor()" class="text-xs text-slate-600 hover:text-blue-600 font-medium px-2 py-0.5 rounded border border-slate-200 flex items-center gap-1">
                  <i data-lucide="code" class="w-3.5 h-3.5"></i> Edit Code
                </button>
                <a id="dashFullscreenBtn" href="#" target="_blank" class="text-xs text-blue-600 font-bold hover:underline">
                  Fullscreen ↗
                </a>
              </div>
            </div>

            <div class="w-full h-[520px] rounded-xl bg-slate-50 border border-slate-200 overflow-hidden relative shadow-inner">
              <iframe id="dashFrame" class="w-full h-full border-0" sandbox="allow-scripts allow-forms allow-same-origin allow-downloads" title="Live Tool Canvas"></iframe>
            </div>
          </div>
        </div>
      </section>

      <!-- ================= MANAGE VIEW ================= -->
      <section id="manageView" class="hidden">
        <h2 class="text-sm font-bold text-slate-900 mb-2">My Created Tools</h2>
        <div id="myToolsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-8"></div>

        <h2 class="text-sm font-bold text-slate-900 mb-2">Shared with Me</h2>
        <div id="sharedToolsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
      </section>

    </main>
  </div>

  <!-- In-Place Code Editor Modal -->
  <div id="editorModal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-3 sm:p-5">
    <div class="bg-white rounded-2xl max-w-4xl w-full h-[85vh] flex flex-col shadow-2xl overflow-hidden border border-slate-200">
      <div class="px-5 py-3 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div>
          <h3 class="text-xs font-bold text-slate-900 flex items-center gap-1.5">
            <i data-lucide="code" class="w-4 h-4 text-blue-600"></i>
            <span id="editorToolTitle">Edit HTML Code</span>
          </h3>
          <span class="text-[10px] text-slate-500 font-mono" id="editorFilePath">/tools-vault/path</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="saveCodeChanges()" id="editorSaveBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold shadow-sm">Save Code</button>
          <button onclick="closeCodeEditor()" class="bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-semibold">✕</button>
        </div>
      </div>
      <div class="flex-1 p-3 bg-slate-950">
        <textarea id="codeEditorArea" class="w-full h-full bg-transparent text-emerald-400 font-mono text-xs outline-none resize-none leading-relaxed" spellcheck="false"></textarea>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    let currentUser = null;
    let myTools = [];
    let sharedTools = [];
    let top10Tools = [];
    let activeToolIndex = 0;
    let currentEditingTool = null;

    async function logout() {
      await sb.auth.signOut();
      window.location.reload();
    }

    function toggleDropdown() { document.getElementById('profileDropdown').classList.toggle('hidden'); }
    window.addEventListener('click', (e) => {
      const drop = document.getElementById('profileDropdown');
      const btn = document.getElementById('avatarBtn');
      if (btn && drop && !btn.contains(e.target) && !drop.contains(e.target)) drop.classList.add('hidden');
    });

    function switchMainView(view) {
      const isDash = view === 'dashboard';
      document.getElementById('dashboardView').classList.toggle('hidden', !isDash);
      document.getElementById('manageView').classList.toggle('hidden', isDash);
      document.getElementById('viewBtnDashboard').className = isDash ? "px-3 py-1.5 rounded-lg bg-white shadow-xs text-blue-600 flex items-center gap-1.5" : "px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 flex items-center gap-1.5";
      document.getElementById('viewBtnManage').className = !isDash ? "px-3 py-1.5 rounded-lg bg-white shadow-xs text-blue-600 flex items-center gap-1.5" : "px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 flex items-center gap-1.5";
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        window.location.href = '/user';
        return;
      }

      currentUser = session.user;
      document.getElementById('loggedInView').style.display = 'flex';

      const meta = currentUser.user_metadata || {};
      document.getElementById('dropdownUserName').innerText = meta.full_name || 'User';
      document.getElementById('dropdownUserEmail').innerText = currentUser.email;

      const avatar = meta.avatar_url;
      if (avatar) {
        const img = document.getElementById('avatarImg');
        img.src = avatar;
        img.classList.remove('hidden');
        document.getElementById('avatarInitials').classList.add('hidden');
      }

      loadData();
    }

    async function loadData() {
      const { data: mine } = await sb.from('tools')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('is_pinned', { ascending: false })
        .order('last_accessed_at', { ascending: false });

      myTools = mine || [];

      const { data: shares } = await sb.from('tool_shares')
        .select('tool_id, tools(*)')
        .or(`user_id.eq.${currentUser.id},shared_email.eq.${currentUser.email}`);

      sharedTools = (shares || []).map(s => s.tools).filter(t => t && t.user_id !== currentUser.id);

      applySort('recent');
      renderManageLists();
    }

    function applySort(criteria) {
      let sorted = [...myTools];
      if (criteria === 'views') {
        sorted.sort((a, b) => (b.view_count || 0) - (a.view_count || 0));
      } else if (criteria === 'alpha') {
        sorted.sort((a, b) => a.title.localeCompare(b.title));
      } else {
        // Recent
        sorted.sort((a, b) => new Date(b.last_accessed_at) - new Date(a.last_accessed_at));
      }

      // Keep pinned on top
      sorted.sort((a, b) => (b.is_pinned === true ? 1 : 0) - (a.is_pinned === true ? 1 : 0));
      top10Tools = sorted.slice(0, 10);
      renderDashboardDock();
    }

    function renderDashboardDock() {
      const container = document.getElementById('dashTabsContainer');
      if (top10Tools.length === 0) {
        container.innerHTML = '<p class="col-span-full text-center text-xs text-slate-400 py-4">Koi tool upload nahi hai. "Add Tool" par click karein.</p>';
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const highlightSlug = params.get('highlight');

      let targetIndex = 0;

      container.innerHTML = top10Tools.map((t, idx) => {
        const isHighlight = t.slug === highlightSlug;
        if (isHighlight) targetIndex = idx;
        return `
          <button id="dash-tab-${idx}" onclick="switchDashTool(${idx})" class="${isHighlight ? 'highlight-pulse' : ''} p-2.5 rounded-xl border border-slate-200 bg-slate-50/60 hover:bg-slate-50 text-left transition-all flex flex-col justify-between h-16">
            <div class="flex items-center justify-between w-full">
              <span class="text-xs font-bold text-slate-900 truncate">${t.title}</span>
              ${t.is_pinned ? '<i data-lucide="pin" class="w-3 h-3 fill-amber-500 text-amber-500 shrink-0"></i>' : ''}
            </div>
            <span class="text-[10px] text-slate-500 font-mono">/tool/${t.slug}</span>
          </button>
        `;
      }).join('');

      lucide.createIcons();
      switchDashTool(targetIndex);
    }

    async function switchDashTool(idx) {
      const tool = top10Tools[idx];
      if (!tool) return;
      activeToolIndex = idx;

      document.querySelectorAll('#dashTabsContainer button').forEach((btn, i) => {
        btn.classList.toggle('tab-active', i === idx);
      });

      document.getElementById('dashActiveTitle').innerText = tool.title;
      document.getElementById('dashFullscreenBtn').href = `/tool/${tool.slug}`;

      const editBtn = document.getElementById('dashEditCodeBtn');
      if (editBtn) {
        if (tool.user_id === currentUser.id) editBtn.classList.remove('hidden');
        else editBtn.classList.add('hidden');
      }

      const frame = document.getElementById('dashFrame');
      try {
        const res = await fetch(tool.file_url + '?t=' + Date.now());
        frame.srcdoc = await res.text();
        setTimeout(() => {
          sb.rpc('increment_tool_view', { tool_slug: tool.slug }).catch(() => {});
        }, 1200);
      } catch (err) {
        if (tool.file_url) frame.src = tool.file_url;
      }
    }

    function renderManageLists() {
      const myGrid = document.getElementById('myToolsGrid');
      myGrid.innerHTML = myTools.map(t => `
        <div class="bg-white border border-slate-200 rounded-xl p-4">
          <div class="flex justify-between items-start mb-2">
            <div>
              <h4 class="text-xs font-bold text-slate-900">${t.title}</h4>
              <div class="text-[10px] text-slate-500 font-mono mt-0.5">/tool/${t.slug} • Views: ${t.view_count || 0}</div>
            </div>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded ${t.is_link_shared ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500'}">
              ${t.is_link_shared ? 'LINK ACTIVE' : 'PRIVATE'}
            </span>
          </div>
          <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-100">
            <a href="/tool/${t.slug}" target="_blank" class="text-xs font-bold text-blue-600">Launch ↗</a>
            <div class="flex gap-1.5">
              <button onclick="openEditorForTool('${t.id}')" class="px-2 py-1 bg-slate-100 rounded text-[11px] font-semibold">✏️ Code</button>
              <button onclick="toggleLinkShare('${t.id}', ${!t.is_link_shared})" class="px-2 py-1 bg-slate-100 rounded text-[11px] font-semibold">${t.is_link_shared ? 'Revoke' : 'Share'}</button>
              <button onclick="togglePin('${t.id}', ${!t.is_pinned})" class="px-2 py-1 bg-slate-100 rounded text-[11px] font-semibold">${t.is_pinned ? 'Unpin' : '📌 Pin'}</button>
              <button onclick="deleteToolPermanently('${t.id}', '${t.storage_path}')" class="px-2 py-1 bg-red-50 text-red-600 rounded text-[11px] font-semibold">✕</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // ================= DUAL STORAGE + DB DELETE =================
    async function deleteToolPermanently(id, storagePath) {
      if (!confirm('Kya aap is tool ko permanently delete karna chahte hain? Storage bucket se bhi file remove ho jayegi.')) return;

      // 1. Delete all versions from Storage bucket
      const { data: vers } = await sb.from('tool_versions').select('storage_path').eq('tool_id', id);
      const pathsToDelete = (vers || []).map(v => v.storage_path).filter(Boolean);
      if (storagePath) pathsToDelete.push(storagePath);

      if (pathsToDelete.length > 0) {
        await sb.storage.from('tools-vault').remove(pathsToDelete);
      }

      // 2. Delete from Database
      await sb.from('tools').delete().eq('id', id);

      loadData();
    }

    // Code Editor
    function openCurrentToolEditor() { openCodeEditor(top10Tools[activeToolIndex]); }
    function openEditorForTool(toolId) { openCodeEditor(myTools.find(t => t.id === toolId)); }

    async function openCodeEditor(tool) {
      if (tool.user_id !== currentUser.id) return alert('Only creator can edit.');
      currentEditingTool = tool;
      document.getElementById('editorToolTitle').innerText = `Edit: ${tool.title}`;
      document.getElementById('editorFilePath').innerText = tool.slug;
      document.getElementById('editorModal').classList.remove('hidden');

      const res = await fetch(tool.file_url + '?t=' + Date.now());
      document.getElementById('codeEditorArea').value = await res.text();
    }

    function closeCodeEditor() { document.getElementById('editorModal').classList.add('hidden'); }

    async function saveCodeChanges() {
      const newCode = document.getElementById('codeEditorArea').value;
      const saveBtn = document.getElementById('editorSaveBtn');
      saveBtn.innerText = 'Saving...';

      const storagePath = currentEditingTool.storage_path || decodeURIComponent(currentEditingTool.file_url.split('/tools-vault/')[1]);

      const blob = new Blob([newCode], { type: 'text/html' });
      await sb.storage.from('tools-vault').upload(storagePath, blob, { upsert: true, contentType: 'text/html' });

      await sb.from('tools').update({ last_accessed_at: new Date().toISOString() }).eq('id', currentEditingTool.id);

      saveBtn.innerText = 'Saved!';
      setTimeout(() => {
        closeCodeEditor();
        saveBtn.innerText = 'Save Code';
        switchDashTool(activeToolIndex);
      }, 500);
    }

    async function togglePin(toolId, makePinned) {
      if (makePinned && myTools.filter(t => t.is_pinned).length >= 3) return alert('Max 3 tools can be pinned.');
      await sb.from('tools').update({ is_pinned: makePinned }).eq('id', toolId);
      loadData();
    }

    async function toggleLinkShare(toolId, makeShared) {
      await sb.from('tools').update({ is_link_shared: makeShared }).eq('id', toolId);
      if (makeShared) {
        const link = `${window.location.origin}/tool/${myTools.find(t => t.id === toolId).slug}`;
        navigator.clipboard.writeText(link);
        alert(`Link copied:\n${link}`);
      }
      loadData();
    }

    init();
  </script>
</body>
</html>
