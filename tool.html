<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tool Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .top-nav-bar {
      height: 38px;
      min-height: 38px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 100;
    }

    .nav-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .home-link {
      display: inline-flex; align-items: center; gap: 4px; color: #2563eb;
      text-decoration: none; font-size: 0.8rem; font-weight: 700; padding: 3px 8px;
      border-radius: 6px; background: #eff6ff; shrink: 0;
    }
    .tool-page-title { font-size: 0.82rem; font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tool-badge-pill { font-size: 0.7rem; font-weight: 600; color: #64748b; background: #f1f5f9; padding: 2px 7px; border-radius: 10px; shrink: 0; }

    .frame-container { flex: 1; width: 100%; height: calc(100dvh - 38px); position: relative; background: #fff; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    
    .center-state {
      display: flex; flex-direction: column; height: 100%; width: 100%;
      align-items: center; justify-content: center; padding: 20px; text-align: center; background: #f8fafc;
    }
    .btn-login {
      margin-top: 14px; background: #2563eb; color: #fff; padding: 9px 18px;
      border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none;
    }
  </style>
</head>
<body>

  <header class="top-nav-bar">
    <div class="nav-left">
      <a href="/" class="home-link">← Home</a>
      <span class="tool-page-title" id="barTitle">Loading...</span>
    </div>
    <span class="tool-badge-pill" id="barBadge">App</span>
  </header>

  <main class="frame-container">
    <div id="loaderSlot" class="center-state">
      <p style="color:#64748b; font-size:0.85rem;">Tool sandbox load ho raha hai...</p>
    </div>

    <div id="authGateSlot" class="center-state" style="display:none;">
      <h3 style="font-size:1.1rem; color:#0f172a; margin-bottom:6px;">Login Required</h3>
      <p style="font-size:0.82rem; color:#64748b; max-width:300px;">Is tool ko access aur save karne ke liye Google se sign in karein.</p>
      <button class="btn-login" onclick="loginToAccess()">Sign in with Google</button>
    </div>

    <div id="deniedSlot" class="center-state" style="display:none;">
      <div style="font-size:1.8rem; margin-bottom:6px;">🔒</div>
      <h3 style="font-size:1.05rem; color:#ef4444; margin-bottom:4px;">Access Denied</h3>
      <p style="font-size:0.82rem; color:#64748b; max-width:320px;">Creator ne is tool ka shared access revoke kar diya hai.</p>
      <a href="/user" class="btn-login" style="background:#0f172a;">Go to Workspace</a>
    </div>

    <!-- Opaque Sandboxed Frame -->
    <iframe id="toolFrame" style="display:none;" sandbox="allow-scripts allow-forms allow-downloads allow-modals"></iframe>
  </main>

  <script>
    let targetSlug = '';

    function getSlug() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      if (parts.length >= 2 && parts[0] === 'tool') return decodeURIComponent(parts[1]);
      return new URLSearchParams(window.location.search).get('id') || '';
    }

    async function loginToAccess() {
      await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.href }
      });
    }

    async function init() {
      targetSlug = getSlug();
      if (!targetSlug) return showError('Tool URL invalid hai.');

      const { data: { session } } = await sb.auth.getSession();
      const currentUser = session ? session.user : null;

      const { data: tool, error } = await sb.from('tools').select('*').eq('slug', targetSlug).single();

      if (error || !tool) {
        document.getElementById('loaderSlot').style.display = 'none';
        if (!currentUser) document.getElementById('authGateSlot').style.display = 'flex';
        else document.getElementById('deniedSlot').style.display = 'flex';
        return;
      }

      const isOwner = currentUser && (tool.user_id === currentUser.id);
      const isFeatured = tool.is_featured_home && tool.approval_status === 'approved';

      if (!isOwner && !isFeatured) {
        if (!currentUser) {
          document.getElementById('loaderSlot').style.display = 'none';
          document.getElementById('authGateSlot').style.display = 'flex';
          return;
        }
        if (!tool.is_link_shared) {
          document.getElementById('loaderSlot').style.display = 'none';
          document.getElementById('deniedSlot').style.display = 'flex';
          return;
        }
      }

      if (currentUser && !isOwner && tool.is_link_shared) {
        sb.from('tool_shares').insert([{ tool_id: tool.id, user_id: currentUser.id }]).catch(() => {});
      }

      document.title = tool.title;
      document.getElementById('barTitle').innerText = tool.title;
      document.getElementById('barBadge').innerText = (tool.tool_type || 'App').toUpperCase();

      const frame = document.getElementById('toolFrame');
      try {
        const res = await fetch(tool.file_url + '?t=' + Date.now());
        if (!res.ok) throw new Error();
        frame.srcdoc = await res.text();
        frame.style.display = 'block';
        document.getElementById('loaderSlot').style.display = 'none';
        sb.rpc('increment_tool_view', { tool_slug: targetSlug }).catch(() => {});
      } catch (e) {
        showError('Tool load nahi ho saka.');
      }
    }

    function showError(msg) {
      document.getElementById('loaderSlot').innerHTML = `<p style="color:#ef4444; font-size:0.85rem;">${msg}</p>`;
    }

    init();
  </script>
</body>
</html>
