<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Running Tool</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    iframe { width: 100%; height: 100%; border: none; }
    .loader {
      display: flex; height: 100vh; align-items: center; justify-content: center;
      font-family: sans-serif; color: #64748b; font-size: 1rem;
    }
  </style>
</head>
<body>

  <div id="loading" class="loader">टूल शुरू हो रहा है...</div>
  <iframe id="toolFrame" style="display:none;" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals"></iframe>

  <script>
    async function initTool() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('id');

      if (!slug) {
        document.getElementById('loading').innerText = 'कोई टूल सेलेक्ट नहीं किया गया।';
        return;
      }

      const { data: tool, error } = await sb
        .from('tools')
        .select('*')
        .eq('slug', slug)
        .single();

      if (error || !tool) {
        document.getElementById('loading').innerText = 'टूल नहीं मिला या अनपब्लिश्ड है।';
        return;
      }

      document.title = tool.title;
      const frame = document.getElementById('toolFrame');
      
      // फाइल फेच करके सीधे आईफ्रेम में इंजेक्ट
      const res = await fetch(tool.file_url);
      const htmlText = await res.text();

      frame.srcdoc = htmlText;
      frame.style.display = 'block';
      document.getElementById('loading').style.display = 'none';
    }

    initTool();
  </script>
</body>
</html>
