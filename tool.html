<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Running Tool</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    iframe { width: 100%; height: 100%; border: none; }
    .loader {
      display: flex; height: 100vh; align-items: center; justify-content: center;
      font-family: sans-serif; color: #64748b; font-size: 1rem;
    }
    /* Floating Home Button */
    .home-floating-btn {
      position: fixed;
      top: 12px;
      right: 14px;
      z-index: 99999;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid #e2e8f0;
      color: #0f172a;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      opacity: 0.65;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }
    .home-floating-btn:hover, .home-floating-btn:active {
      opacity: 1;
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <a href="/" class="home-floating-btn" title="Dashboard par wapas jayein">
    <span>🏠</span> Home
  </a>

  <div id="loading" class="loader">टूल शुरू हो रहा है...</div>
  <iframe id="toolFrame" style="display:none;" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals"></iframe>

  <script>
    async function initTool() {
      // Dono tarike support honge: /tool/quick-beam ya /tool?id=quick-beam
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      let slug = '';
      if (pathParts.length >= 2 && pathParts[0] === 'tool') {
        slug = pathParts[1];
      } else {
        const params = new URLSearchParams(window.location.search);
        slug = params.get('id');
      }

      if (!slug) {
        document.getElementById('loading').innerText = 'कोई टूल सेलेक्ट नहीं किया गया।';
        return;
      }

      // Check LocalStorage cache first for ultra-fast instant render
      const cachedTools = JSON.parse(localStorage.getItem('my_cached_tools') || '[]');
      const cached = cachedTools.find(t => t.slug === slug);

      let fileUrl = cached ? cached.file_url : null;
      let title = cached ? cached.title : 'Tool';

      if (!fileUrl) {
        const { data: tool, error } = await sb
          .from('tools')
          .select('*')
          .eq('slug', slug)
          .single();

        if (error || !tool) {
          document.getElementById('loading').innerText = 'टूल नहीं मिला या अनपब्लिश्ड है।';
          return;
        }
        fileUrl = tool.file_url;
        title = tool.title;
      }

      document.title = title;
      const frame = document.getElementById('toolFrame');
      
      const res = await fetch(fileUrl);
      const htmlText = await res.text();

      frame.srcdoc = htmlText;
      frame.style.display = 'block';
      document.getElementById('loading').style.display = 'none';
    }

    initTool();
  </script>
</body>
</html>
