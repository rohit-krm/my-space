<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fbfbfd;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .top-nav-bar {
      height: 38px;
      min-height: 38px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 100;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #2563eb;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      background: #eff6ff;
    }
    .home-link:active { background: #dbeafe; }

    .tool-page-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #0f172a;
    }

    .tool-badge-pill {
      font-size: 0.72rem;
      font-weight: 600;
      color: #64748b;
      background: #f1f5f9;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .frame-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 38px);
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .loader {
      display: flex;
      height: 100%;
      width: 100%;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header class="top-nav-bar">
    <div class="nav-left">
      <a href="/" class="home-link"><span>←</span> Home</a>
      <span class="tool-page-title" id="barTitle">Loading...</span>
    </div>
    <span class="tool-badge-pill" id="barBadge">App</span>
  </header>

  <main class="frame-container">
    <div id="loading" class="loader">टूल शुरू हो रहा है...</div>
    <iframe id="toolFrame" style="display:none;" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals"></iframe>
  </main>

  <script>
    async function initTool() {
      // 1. Slug extract karein
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      let slug = '';
      if (pathParts.length >= 2 && pathParts[0] === 'tool') {
        slug = decodeURIComponent(pathParts[1]);
      } else {
        const params = new URLSearchParams(window.location.search);
        slug = params.get('id');
      }

      if (!slug) {
        document.getElementById('loading').innerText = 'कोई टूल सेलेक्ट नहीं किया गया।';
        return;
      }

      // 2. Database se hamesha fresh tool data fetch karein
      const { data: tool, error } = await sb
        .from('tools')
        .select('*')
        .eq('slug', slug)
        .single();

      if (error || !tool) {
        document.getElementById('loading').innerText = 'टूल नहीं मिला या अनपब्लिश्ड है।';
        return;
      }

      document.title = tool.title;
      document.getElementById('barTitle').innerText = tool.title;
      document.getElementById('barBadge').innerText = tool.badge || 'Tool';

      const frame = document.getElementById('toolFrame');
      
      try {
        const res = await fetch(tool.file_url);
        if (!res.ok) {
          throw new Error('Storage file fetch failed');
        }
        const htmlText = await res.text();
        frame.srcdoc = htmlText;
        frame.style.display = 'block';
        document.getElementById('loading').style.display = 'none';

        // Background me view count increment (non-blocking)
        sb.rpc('increment_tool_view', { tool_slug: slug }).catch(() => {});
      } catch (err) {
        document.getElementById('loading').innerText = 'फाइल लोड करने में समस्या हुई। कृपया दोबारा अपलोड करें।';
      }
    }

    initTool();
  </script>
</body>
</html>
