<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Tools & Workspace</title>
  <link rel="stylesheet" href="/assets/css/global.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <style>
    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .user-btn {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-light);
      text-decoration: none;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      border: 1px solid #bfdbfe;
      transition: background 0.15s ease;
    }
    .user-btn:active {
      background: #dbeafe;
    }
  </style>
</head>
<body>

  <main class="container">
    <header style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 2rem;">
      <div>
        <h1>Public Tools</h1>
        <p>Instant productivity utilities</p>
      </div>
      <div class="top-actions">
        <!-- Direct clean gateway to user space (Admin button removed) -->
        <a href="/user" class="user-btn" id="portalBtn">Workspace / Sign in →</a>
      </div>
    </header>

    <div class="tool-grid" id="toolGrid">
      <div style="padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.95rem;">
        Tools load ho rahe hain...
      </div>
    </div>
  </main>

  <script>
    async function loadPublicTools() {
      const grid = document.getElementById('toolGrid');
      
      // Fast local cache check
      const cached = localStorage.getItem('my_cached_tools');
      if (cached) {
        renderCards(JSON.parse(cached));
      }

      // Fetch public approved tools
      const { data: tools, error } = await sb
        .from('tools')
        .select('*')
        .eq('is_public', true)
        .order('is_pinned', { ascending: false })
        .order('sort_order', { ascending: true });

      if (!error && tools && tools.length > 0) {
        localStorage.setItem('my_cached_tools', JSON.stringify(tools));
        renderCards(tools);
      } else if (!cached) {
        grid.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding: 2rem 0;">Filhal koi public tool live nahi hai.</p>';
      }
    }

    function renderCards(tools) {
      const grid = document.getElementById('toolGrid');
      grid.innerHTML = tools.map(tool => `
        <a href="/tool/${encodeURIComponent(tool.slug)}" class="tool-card">
          <div class="tool-info">
            <h3>${tool.title}</h3>
            <p>${tool.description || ''}</p>
          </div>
          <span class="badge">${tool.badge || 'Tool'}</span>
        </a>
      `).join('');
    }

    loadPublicTools();
  </script>
</body>
</html>
