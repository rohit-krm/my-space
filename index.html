<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Workspace</title>
  <link rel="stylesheet" href="/assets/css/global.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <style>
    .loading-shimmer {
      padding: 2rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <main class="container">
    <header style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <h1>Personal Tools</h1>
        <p>सुपरफास्ट इंटरनल प्रोडक्टिविटी टूल्स</p>
      </div>
      <a href="/admin" style="font-size:0.85rem; color:var(--text-muted); text-decoration:none; padding:0.4rem 0.8rem; border:1px solid var(--border); border-radius:8px;">Admin</a>
    </header>

    <div class="tool-grid" id="toolGrid">
      <div class="loading-shimmer">टूल्स लोड हो रहे हैं...</div>
    </div>
  </main>

  <script>
    async function loadTools() {
      const grid = document.getElementById('toolGrid');
      
      // 1. Agar Cache me pehle se tools hain, turant render karo (0ms latency)
      const cachedData = localStorage.getItem('my_cached_tools');
      if (cachedData) {
        const cachedTools = JSON.parse(cachedData);
        renderCards(cachedTools);
      }
    
      // 2. Background me silently fresh data fetch karo
      const { data: tools, error } = await sb
        .from('tools')
        .select('*')
        .eq('is_public', true)
        .order('sort_order', { ascending: true });
    
      if (!error && tools) {
        // Cache update kar do future ke liye
        localStorage.setItem('my_cached_tools', JSON.stringify(tools));
        renderCards(tools);
      } else if (!cachedData) {
        grid.innerHTML = '<p style="color:var(--text-muted); text-align:center;">अभी कोई टूल लाइव नहीं है। Admin से अपलोड करें।</p>';
      }
    }
    
    function renderCards(tools) {
      const grid = document.getElementById('toolGrid');
      if (!tools || tools.length === 0) return;
    
      grid.innerHTML = tools.map(tool => `
        <a href="/tool/${encodeURIComponent(tool.slug)}" class="tool-card">
          <div class="tool-info">
            <h3>${tool.title}</h3>
            <p>${tool.description || ''}</p>
          </div>
          <span class="badge">${tool.badge || 'Tool'}</span>
        </a>
      `).join('');
    }

    loadTools();
  </script>
</body>
</html>
